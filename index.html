<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>Minhas Anotações</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:#2563eb;color:#fff;padding:20px 18px 18px;border-radius:0 0 22px 22px}h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.9}.wrap{padding:16px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{border:0;background:#fff;padding:10px 13px;border-radius:20px;white-space:nowrap}.tabs button.active{background:#2563eb;color:#fff}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:22px;color:#2563eb}input,textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;margin:5px 0 9px;font-size:16px}textarea{min-height:120px;resize:vertical}button.primary{width:100%;border:0;background:#2563eb;color:#fff;padding:13px;border-radius:10px;font-size:16px}.secondary{width:100%;border:0;background:#eef2f7;color:#344054;padding:11px;border-radius:10px;font-size:15px;margin-top:7px}.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid #eee;padding:12px 0}.item:first-child{border-top:0}.item small{color:#667085;white-space:pre-wrap}.actions{display:flex;gap:6px;flex-shrink:0}.edit{border:0;background:#e8f0ff;color:#1d4ed8;border-radius:8px;padding:8px}.del{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:8px}.check{width:20px;height:20px;vertical-align:middle}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#2563eb;color:#fff;font-size:30px;box-shadow:0 5px 18px #0003}.hidden{display:none}.empty{text-align:center;color:#777;padding:20px}.editing{background:#fff7e6;border:1px solid #f5c46b}
</style></head><body>
<header><h1>📓 Minhas Anotações</h1><p id="date"></p></header>
<div class="wrap"><div class="tabs">
<button class="active" onclick="show('home',this)">Hoje</button><button onclick="show('tasks',this)">Tarefas</button><button onclick="show('events',this)">Compromissos</button><button onclick="show('notes',this)">Anotações</button><button onclick="show('services',this)">Serviços</button>
</div>
<section id="home"><div class="card stats"><div class="stat"><b id="st">0</b>Tarefas</div><div class="stat"><b id="se">0</b>Hoje</div><div class="stat"><b id="sn">0</b>Anotações</div></div><div class="card"><h3>Resumo de hoje</h3><div id="today"></div></div></section>
<section id="tasks" class="hidden"><div class="card"><h3>Nova tarefa</h3><input id="taskTitle" placeholder="O que precisa fazer?"><input id="taskDate" type="date"><input id="taskTime" type="time"><button class="primary" id="taskBtn" onclick="saveTask()">Adicionar tarefa</button><button class="secondary hidden" id="taskCancel" onclick="cancelEdit('task')">Cancelar edição</button></div><div class="card"><div id="taskList"></div></div></section>
<section id="events" class="hidden"><div class="card"><h3>Novo compromisso</h3><input id="eventTitle" placeholder="Compromisso"><input id="eventDate" type="date"><input id="eventTime" type="time"><input id="eventPlace" placeholder="Local"><button class="primary" id="eventBtn" onclick="saveEvent()">Adicionar compromisso</button><button class="secondary hidden" id="eventCancel" onclick="cancelEdit('event')">Cancelar edição</button></div><div class="card"><div id="eventList"></div></div></section>
<section id="notes" class="hidden"><div class="card"><h3>Nova anotação</h3><input id="noteTitle" placeholder="Título"><textarea id="noteText" placeholder="Escreva sua anotação..."></textarea><button class="primary" id="noteBtn" onclick="saveNote()">Salvar anotação</button><button class="secondary hidden" id="noteCancel" onclick="cancelEdit('note')">Cancelar edição</button></div><div class="card"><div id="noteList"></div></div></section>
<section id="services" class="hidden"><div class="card"><h3>Novo serviço</h3><input id="svcClient" placeholder="Cliente"><input id="svcName" placeholder="Serviço"><input id="svcDate" type="date"><input id="svcValue" type="number" step="0.01" placeholder="Valor (R$)"><button class="primary" id="svcBtn" onclick="saveService()">Salvar serviço</button><button class="secondary hidden" id="svcCancel" onclick="cancelEdit('service')">Cancelar edição</button></div><div class="card"><div id="svcList"></div></div></section>
</div><button class="fab" onclick="quick()">+</button>
<script>
const K='anotacoes-v1';let db=JSON.parse(localStorage.getItem(K)||'{"tasks":[],"events":[],"notes":[],"services":[]}');let editing=null;
const save=()=>{localStorage.setItem(K,JSON.stringify(db));render()};
const todayStr=()=>new Date().toISOString().slice(0,10);
document.getElementById('date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
function show(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function fmt(d){return d?new Date(d+'T12:00').toLocaleDateString('pt-BR'):''}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function cancelEdit(type){editing=null;if(type==='task'){taskTitle.value=taskDate.value=taskTime.value='';taskBtn.textContent='Adicionar tarefa';taskCancel.classList.add('hidden')}if(type==='event'){eventTitle.value=eventDate.value=eventTime.value=eventPlace.value='';eventBtn.textContent='Adicionar compromisso';eventCancel.classList.add('hidden')}if(type==='note'){noteTitle.value=noteText.value='';noteBtn.textContent='Salvar anotação';noteCancel.classList.add('hidden')}if(type==='service'){svcClient.value=svcName.value=svcDate.value=svcValue.value='';svcBtn.textContent='Salvar serviço';svcCancel.classList.add('hidden')}}
function saveTask(){let t=taskTitle.value.trim();if(!t)return;let x=editing?.type==='tasks'?db.tasks.find(x=>x.id===editing.id):null;if(x)Object.assign(x,{title:t,date:taskDate.value||todayStr(),time:taskTime.value});else db.tasks.push({id:Date.now(),title:t,date:taskDate.value||todayStr(),time:taskTime.value,done:false});cancelEdit('task');save()}
function saveEvent(){let t=eventTitle.value.trim();if(!t)return;let x=editing?.type==='events'?db.events.find(x=>x.id===editing.id):null;if(x)Object.assign(x,{title:t,date:eventDate.value||todayStr(),time:eventTime.value,place:eventPlace.value});else db.events.push({id:Date.now(),title:t,date:eventDate.value||todayStr(),time:eventTime.value,place:eventPlace.value});cancelEdit('event');save()}
function saveNote(){let t=noteTitle.value.trim(),tx=noteText.value.trim();if(!t&&!tx)return;let x=editing?.type==='notes'?db.notes.find(x=>x.id===editing.id):null;if(x)Object.assign(x,{title:t||'Anotação',text:tx});else db.notes.push({id:Date.now(),title:t||'Anotação',text:tx});cancelEdit('note');save()}
function saveService(){let c=svcClient.value.trim(),s=svcName.value.trim();if(!c&&!s)return;let x=editing?.type==='services'?db.services.find(x=>x.id===editing.id):null;if(x)Object.assign(x,{client:c,service:s,date:svcDate.value||todayStr(),value:svcValue.value});else db.services.push({id:Date.now(),client:c,service:s,date:svcDate.value||todayStr(),value:svcValue.value});cancelEdit('service');save()}
function editItem(type,id){editing={type,id};let x=db[type].find(x=>x.id===id);if(!x)return;let idx=type==='tasks'?1:type==='events'?2:type==='notes'?3:4;let sec=type==='tasks'?'tasks':type==='events'?'events':type==='notes'?'notes':'services';show(sec,document.querySelectorAll('.tabs button')[idx]);if(type==='tasks'){taskTitle.value=x.title;taskDate.value=x.date||'';taskTime.value=x.time||'';taskBtn.textContent='Salvar alteração';taskCancel.classList.remove('hidden')}if(type==='events'){eventTitle.value=x.title;eventDate.value=x.date||'';eventTime.value=x.time||'';eventPlace.value=x.place||'';eventBtn.textContent='Salvar alteração';eventCancel.classList.remove('hidden')}if(type==='notes'){noteTitle.value=x.title;noteText.value=x.text||'';noteBtn.textContent='Salvar alteração';noteCancel.classList.remove('hidden')}if(type==='services'){svcClient.value=x.client||'';svcName.value=x.service||'';svcDate.value=x.date||'';svcValue.value=x.value||'';svcBtn.textContent='Salvar alteração';svcCancel.classList.remove('hidden')}window.scrollTo({top:0,behavior:'smooth'})}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);save()}
function toggle(id){let x=db.tasks.find(x=>x.id===id);if(x)x.done=!x.done;save()}
function render(){
st.textContent=db.tasks.filter(x=>!x.done).length;se.textContent=db.events.filter(x=>x.date===todayStr()).length;sn.textContent=db.notes.length;
let all=[...db.tasks.filter(x=>x.date===todayStr()).map(x=>({s:'Tarefa',t:x.title})),...db.events.filter(x=>x.date===todayStr()).map(x=>({s:'Compromisso',t:x.title}))];today.innerHTML=all.length?all.map(x=>'<div class="item"><span><b>'+esc(x.s)+'</b><br>'+esc(x.t)+'</span></div>').join(''):'<div class="empty">Nada marcado para hoje.</div>';
taskList.innerHTML=db.tasks.length?db.tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>'<div class="item"><span><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+x.id+')"> <b style="'+(x.done?'text-decoration:line-through':'')+'">'+esc(x.title)+'</b><br><small>'+fmt(x.date)+' '+esc(x.time||'')+'</small></span><span class="actions"><button class="edit" onclick="editItem(\'tasks\','+x.id+')">Editar</button><button class="del" onclick="del(\'tasks\','+x.id+')">Excluir</button></span></div>').join(''):'<div class="empty">Nenhuma tarefa.</div>';
eventList.innerHTML=db.events.length?db.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>'<div class="item"><span><b>'+esc(x.title)+'</b><br><small>'+fmt(x.date)+' '+esc(x.time||'')+(x.place?' • '+esc(x.place):'')+'</small></span><span class="actions"><button class="edit" onclick="editItem(\'events\','+x.id+')">Editar</button><button class="del" onclick="del(\'events\','+x.id+')">Excluir</button></span></div>').join(''):'<div class="empty">Nenhum compromisso.</div>';
noteList.innerHTML=db.notes.length?db.notes.slice().reverse().map(x=>'<div class="item"><span><b>'+esc(x.title)+'</b><br><small>'+esc(x.text)+'</small></span><span class="actions"><button class="edit" onclick="editItem(\'notes\','+x.id+')">Editar</button><button class="del" onclick="del(\'notes\','+x.id+')">Excluir</button></span></div>').join(''):'<div class="empty">Nenhuma anotação.</div>';
svcList.innerHTML=db.services.length?db.services.slice().reverse().map(x=>'<div class="item"><span><b>'+esc(x.client)+'</b><br>'+esc(x.service)+'<br><small>'+fmt(x.date)+' • R$ '+Number(x.value||0).toFixed(2).replace('.',',')+'</small></span><span class="actions"><button class="edit" onclick="editItem(\'services\','+x.id+')">Editar</button><button class="del" onclick="del(\'services\','+x.id+')">Excluir</button></span></div>').join(''):'<div class="empty">Nenhum serviço.</div>';
}
function quick(){show('tasks',document.querySelectorAll('.tabs button')[1]);taskTitle.focus()}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
